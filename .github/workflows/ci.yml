name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y libxkbcommon-dev

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  perf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: System libraries
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y libxkbcommon-dev

      # Baselines are per platform: comparing a Linux run against macOS timings is too noisy
      # to gate. When the Linux baseline is missing, record one and upload it so it can be
      # reviewed and committed. The harness's calibration scenario normalizes runner speed.
      - name: Benchmark against baseline
        shell: bash
        run: |
          set -o pipefail
          baseline=benches/perf-baseline-linux-x86_64.json
          if [ -f "$baseline" ]; then
            cargo bench --bench crawl -- --json --compare "$baseline" --threshold 30 | tee perf-report.json
          else
            echo "No Linux baseline committed; recording one for review."
            cargo bench --bench crawl -- --json --save-baseline "$baseline" | tee perf-report.json
          fi

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf-report.json
          if-no-files-found: ignore

      - name: Upload generated baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-baseline-linux-x86_64
          path: benches/perf-baseline-linux-x86_64.json
          if-no-files-found: ignore
