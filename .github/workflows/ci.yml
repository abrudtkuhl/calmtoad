name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Prepare xkbcommon linker (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          library="$(ldconfig -p | awk '$1 == "libxkbcommon.so.0" { print $NF; exit }')"
          if [[ -z "$library" ]]; then
            echo "The Linux runner does not provide libxkbcommon.so.0." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/xkbcommon"
          ln -s "$library" "$RUNNER_TEMP/xkbcommon/libxkbcommon.so"
          echo "RUSTFLAGS=-L native=$RUNNER_TEMP/xkbcommon" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
