name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml, without the v prefix (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Releases promote `--latest`. Serialize every version so two runs can never race
  # each other, and so a retry of an older version cannot overtake a newer one.
  group: release
  cancel-in-progress: false

jobs:
  create_tag:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      mode: ${{ steps.tag.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install minisign for the signing preflight
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign

      - name: Validate version and notes, then create tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run releases from the main branch." >&2
            exit 1
          fi

          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "calmtoad") | .version')"
          if [[ "$REQUESTED_VERSION" != "$version" ]]; then
            echo "Requested $REQUESTED_VERSION, but Cargo.toml declares $version." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The updater only ships stable versions; Cargo.toml declares: $version" >&2
            exit 1
          fi

          python3 -m unittest discover -s scripts -p 'test_release_notes.py'
          python3 scripts/release_notes.py "$version" > "$RUNNER_TEMP/release-notes.md"

          tag="v$version"
          # This is exactly the release that releases/latest/download resolves to.
          # Fail closed: a transient API error must not be mistaken for "no releases",
          # which would let an older draft promote itself with --latest.
          latest_error="$RUNNER_TEMP/latest-release.err"
          latest_status=0
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name // ""' 2>"$latest_error")" || latest_status=$?
          if [[ "$latest_status" -ne 0 ]]; then
            if grep -qE 'HTTP 404|Not Found' "$latest_error"; then
              latest_tag=""
            else
              cat "$latest_error" >&2
              echo "Could not determine the latest release; refusing to promote an older draft." >&2
              exit 1
            fi
          fi
          latest_version=""
          if [[ -n "$latest_tag" ]]; then
            latest_version="${latest_tag#v}"
            if [[ "$version" != "$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -n1)" ]]; then
              echo "$version is older than the latest published release ($latest_tag)." >&2
              echo "Publish a newer version instead; latest is never moved backwards." >&2
              exit 1
            fi
          fi

          # A published release for this exact version is the only case allowed to run
          # again. It updates notes and never touches the tag, assets, or latest.
          mode="new"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]]; then
              if [[ -n "$latest_version" && "$version" == "$latest_version" ]]; then
                mode="notes-only"
              else
                echo "$tag is published but is not the latest release ($latest_tag)." >&2
                echo "Refusing to modify a published release that latest does not point at." >&2
                exit 1
              fi
            fi
          fi

          previous_tag="$(git tag --merged HEAD --sort=-version:refname 'v[0-9]*' | awk -v current="$tag" '$0 != current' | sed -n '1p')"
          if [[ -n "$previous_tag" ]]; then
            printf '\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous_tag" "$tag" >> "$RUNNER_TEMP/release-notes.md"
          fi

          if [[ "$mode" == "notes-only" ]]; then
            echo "Release $tag is already published and latest: updating notes only."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "mode=notes-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${MINISIGN_SECRET_KEY:-}" ]]; then
            echo "Add the MINISIGN_SECRET_KEY repository secret before releasing." >&2
            exit 1
          fi

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tag_exists=true
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            existing_commit="$(git rev-parse "$tag^{commit}")"
            if [[ "$existing_commit" != "$GITHUB_SHA" ]] && ! git merge-base --is-ancestor "$existing_commit" "$GITHUB_SHA"; then
              echo "$tag already exists outside the selected main history." >&2
              exit 1
            fi
            # Build and publish check out the tag, not this commit. If the tag carries
            # different signing material, packaging scripts, or manifest tooling,
            # retrying it here cannot repair that: the new files would never be used.
            if ! git diff --quiet "$tag" "$GITHUB_SHA" -- \
              assets/updater.pub assets/entitlements.plist \
              scripts/release-manifest.sh scripts/install.sh scripts/package-macos.sh \
              scripts/check-macos-codesign-identity.sh; then
              echo "$tag predates the current packaging or updater signing tooling." >&2
              echo "An existing tag builds with its own assets and scripts, so this" >&2
              echo "retry cannot fix it." >&2
              echo "Release a new version, or deliberately delete and recreate the tag" >&2
              echo "before retrying with current tooling." >&2
              exit 1
            fi
          fi

          # Prove the stored private key signs, and that the committed public key
          # verifies that signature, before a tag exists. A broken key pair then
          # fails here instead of leaving a fresh tag and a stuck draft behind.
          key="$RUNNER_TEMP/minisign.key"
          probe="$RUNNER_TEMP/signing-preflight.txt"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          trap 'rm -f "$key" "$probe" "$probe.minisig"' EXIT
          printf 'calmtoad signing preflight\n' > "$probe"
          minisign -Sm "$probe" -s "$key" -t "Calm Toad signing preflight"
          minisign -Vm "$probe" -p assets/updater.pub
          rm -f "$key" "$probe" "$probe.minisig"
          trap - EXIT

          if [[ "$tag_exists" == false ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" -m "Calm Toad $tag"
            git push origin "$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=new" >> "$GITHUB_OUTPUT"

      # Carry validated notes from the dispatch commit through retries, even when
      # the existing tag predates the release-notes tooling.
      - uses: actions/upload-artifact@v7
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  notes:
    needs: create_tag
    if: needs.create_tag.outputs.mode == 'notes-only'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/notes

      - name: Update published release notes only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create_tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes/release-notes.md"
          if [[ ! -s "$notes" ]]; then
            echo "Validated release notes are missing or empty." >&2
            exit 1
          fi
          # Leave the tag, every asset, the manifest, and latest untouched.
          gh release edit "$TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"

  build:
    needs: create_tag
    if: needs.create_tag.outputs.mode == 'new'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: macos-aarch64
            download: Calm-Toad-Mac-Apple-Silicon.zip
          - os: macos-26-intel
            asset: macos-x86_64
            download: Calm-Toad-Mac-Intel.zip
          - os: windows-latest
            asset: windows-x86_64
            download: Calm-Toad-Windows.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create_tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Build
        run: cargo build --release --locked

      - name: Import the Developer ID certificate when one is configured
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12:-}" ]]; then
            echo "No MACOS_CERT_P12 secret; the downloads will be ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(openssl rand -hex 16)"
          p12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$p12"' EXIT
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | openssl base64 -d -A -out "$p12"
          # PKCS#12 is an aggregate: import certificate + private key, not cert-only.
          if ! security import "$p12" \
            -P "${MACOS_CERT_PASSWORD:-}" -A -t agg -f pkcs12 -k "$keychain" >/dev/null 2>&1; then
            echo "Could not import the Developer ID PKCS#12 signing identity." >&2
            exit 1
          fi
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          chmod +x scripts/check-macos-codesign-identity.sh
          scripts/check-macos-codesign-identity.sh "$keychain"
          rm -f "$p12"
          trap - EXIT

      - name: Prepare macOS downloads
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.create_tag.outputs.version }}
          DOWNLOAD: ${{ matrix.download }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh \
            --binary target/release/calmtoad \
            --version "$VERSION" \
            --name "${DOWNLOAD%.zip}" \
            --out dist

      - name: Prepare Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOWNLOAD: ${{ matrix.download }}
        run: |
          $package = "dist/Calm Toad"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item target/release/calmtoad.exe "$package/Calm Toad.exe"
          Copy-Item README.md $package
          Compress-Archive -Path "$package/*" -DestinationPath "dist/$env:DOWNLOAD" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/Calm-Toad-*
          if-no-files-found: error
          retention-days: 7

  # Linux is built in an Ubuntu 22.04 container, checked against a glibc ceiling, and opened
  # on Ubuntu 22.04, Ubuntu 24.04, and Debian 13 before anything is published.
  build_linux:
    needs: create_tag
    if: needs.create_tag.outputs.mode == 'new'
    permissions:
      contents: read
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ needs.create_tag.outputs.tag }}
      artifact: release-linux-x86_64

  publish:
    needs: [create_tag, build, build_linux]
    if: needs.create_tag.outputs.mode == 'new'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create_tag.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: changelog-notes
          path: ${{ runner.temp }}/notes

      - uses: oras-project/setup-oras@v2.0.3
        with:
          version: 1.3.6

      # The one-line installer ships as a release asset too, so
      # releases/latest/download/install.sh always installs the newest version.
      - name: Stage the installer script
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          cp scripts/install.sh dist/install.sh
          chmod +x dist/install.sh

      - name: Install minisign
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign

      # Everything is uploaded to a draft first. The manifest goes up last, and the
      # release is only made public after its assets and signature verify, so the
      # latest/download/latest.json URL never points at a half-uploaded release.
      - name: Stage the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create_tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes/release-notes.md"
          if [[ ! -s "$notes" ]]; then
            echo "Validated release notes are missing or empty." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "$TAG is already published; publish a new version instead of replacing its assets." >&2
              exit 1
            fi
            # Resume a draft left by an earlier failed run.
            while IFS= read -r asset; do
              if [[ -n "$asset" ]]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" dist/Calm-Toad-* dist/install.sh --clobber
            gh release edit "$TAG" --title "Calm Toad $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/Calm-Toad-* dist/install.sh \
              --draft \
              --verify-tag \
              --title "Calm Toad $TAG" \
              --notes-file "$notes"
          fi

      - name: Build and sign the update manifest
        env:
          TAG: ${{ needs.create_tag.outputs.tag }}
          VERSION: ${{ needs.create_tag.outputs.version }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MINISIGN_SECRET_KEY:-}" ]]; then
            echo "Add the MINISIGN_SECRET_KEY repository secret before releasing." >&2
            exit 1
          fi
          chmod +x scripts/release-manifest.sh
          scripts/release-manifest.sh "$VERSION" "$TAG" "$RUNNER_TEMP/notes/release-notes.md" dist

          key="$RUNNER_TEMP/minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -Sm dist/latest.json -s "$key" -t "Calm Toad $TAG update manifest"
          rm -f "$key"

          # Check the exact bytes we are about to upload.
          minisign -Vm dist/latest.json -p assets/updater.pub
          jq -e '.schema_version == 1' dist/latest.json >/dev/null

      - name: Upload the signed manifest to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create_tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/latest.json dist/latest.json.minisig --clobber

      - name: Verify the draft before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create_tag.outputs.tag }}
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          gh release download "$TAG" --dir "$verify"

          minisign -Vm "$verify/latest.json" -p assets/updater.pub
          for platform in macos-aarch64 macos-x86_64 windows-x86_64 linux-x86_64; do
            name="$(jq -r --arg p "$platform" '.platforms[$p].url | split("/") | last' "$verify/latest.json")"
            expected="$(jq -r --arg p "$platform" '.platforms[$p].sha256' "$verify/latest.json")"
            if [[ ! -f "$verify/$name" ]]; then
              echo "The draft is missing $name." >&2
              exit 1
            fi
            actual="$(sha256sum "$verify/$name" | awk '{ print $1 }')"
            if [[ "$expected" != "$actual" ]]; then
              echo "Checksum mismatch for $name." >&2
              exit 1
            fi
          done

          for required in install.sh Calm-Toad-Mac-Apple-Silicon.dmg Calm-Toad-Mac-Intel.dmg; do
            if [[ ! -f "$verify/$required" ]]; then
              echo "The draft is missing $required." >&2
              exit 1
            fi
          done
          sh -n "$verify/install.sh"

      - name: Publish downloads to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create_tag.outputs.tag }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "ghcr.io/${owner}/calmtoad:${TAG}" \
            --artifact-type application/vnd.calmtoad.release.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${TAG}" \
            dist/Calm-Toad-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create_tag.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
