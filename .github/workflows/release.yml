name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml, without the v prefix (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  create_tag:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate version and create tag
        id: tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run releases from the main branch." >&2
            exit 1
          fi

          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "calmtoad") | .version')"
          if [[ "$REQUESTED_VERSION" != "$version" ]]; then
            echo "Requested $REQUESTED_VERSION, but Cargo.toml declares $version." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Cargo.toml version is not a supported SemVer version: $version" >&2
            exit 1
          fi

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            existing_commit="$(git rev-parse "$tag^{commit}")"
            if [[ "$existing_commit" != "$GITHUB_SHA" ]] && ! git merge-base --is-ancestor "$existing_commit" "$GITHUB_SHA"; then
              echo "$tag already exists outside the selected main history." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" -m "Calm Toad $tag"
            git push origin "$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: create_tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            asset: linux-x86_64
            download: Calm-Toad-Linux.tar.gz
          - os: macos-latest
            asset: macos-aarch64
            download: Calm-Toad-Mac-Apple-Silicon.zip
          - os: macos-26-intel
            asset: macos-x86_64
            download: Calm-Toad-Mac-Intel.zip
          - os: windows-latest
            asset: windows-x86_64
            download: Calm-Toad-Windows.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create_tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Prepare xkbcommon linker (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          library="$(ldconfig -p | awk '$1 == "libxkbcommon.so.0" { print $NF; exit }')"
          if [[ -z "$library" ]]; then
            echo "The Linux runner does not provide libxkbcommon.so.0." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/xkbcommon"
          ln -s "$library" "$RUNNER_TEMP/xkbcommon/libxkbcommon.so"
          echo "RUSTFLAGS=-L native=$RUNNER_TEMP/xkbcommon" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked

      - name: Prepare Linux download
        if: runner.os == 'Linux'
        env:
          DOWNLOAD: ${{ matrix.download }}
        run: |
          set -euo pipefail
          package="dist/Calm Toad"
          mkdir -p "$package"
          cp target/release/calmtoad "$package/Calm Toad"
          cp README.md "$package/"
          tar -C dist -czf "dist/${DOWNLOAD}" "${package#dist/}"

      - name: Prepare macOS app download
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.create_tag.outputs.version }}
          DOWNLOAD: ${{ matrix.download }}
        run: |
          set -euo pipefail
          package="dist/Calm Toad"
          app="$package/Calm Toad.app"
          mkdir -p "$app/Contents/MacOS"
          cp target/release/calmtoad "$app/Contents/MacOS/calmtoad"
          cp README.md "$package/README.md"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>calmtoad</string>
            <key>CFBundleIdentifier</key><string>app.calmtoad.desktop</string>
            <key>CFBundleName</key><string>Calm Toad</string>
            <key>CFBundleDisplayName</key><string>Calm Toad</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
          </dict>
          </plist>
          PLIST
          ditto -c -k --sequesterRsrc --keepParent "$package" "dist/${DOWNLOAD}"

      - name: Prepare Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOWNLOAD: ${{ matrix.download }}
        run: |
          $package = "dist/Calm Toad"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item target/release/calmtoad.exe "$package/Calm Toad.exe"
          Copy-Item README.md $package
          Compress-Archive -Path "$package/*" -DestinationPath "dist/$env:DOWNLOAD" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.download }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [create_tag, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create_tag.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: oras-project/setup-oras@v2.0.3
        with:
          version: 1.3.6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if [[ -n "$assets" ]]; then
              while IFS= read -r asset; do
                gh release delete-asset "$TAG" "$asset" --yes
              done <<< "$assets"
            fi
            gh release upload "$TAG" dist/Calm-Toad-* --clobber
            gh release edit "$TAG" --title "Calm Toad $TAG"
          else
            gh release create "$TAG" dist/Calm-Toad-* \
              --verify-tag \
              --title "Calm Toad $TAG" \
              --generate-notes
          fi

      - name: Publish downloads to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create_tag.outputs.tag }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "ghcr.io/${owner}/calmtoad:${TAG}" \
            --artifact-type application/vnd.calmtoad.release.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${TAG}" \
            dist/Calm-Toad-*
